[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "leakhound"
version = "0.1.0"
description = "A precise, safety-first secret scanner for CI diffs and git history."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kayhan" }]
keywords = ["security", "secrets", "scanner", "ci", "git", "leak-detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "PyYAML>=5.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/kayhanyl/leakhound"
Issues = "https://github.com/kayhanyl/leakhound/issues"

[project.scripts]
leakhound = "leakhound.cli:main"

[tool.setuptools]
packages = ["leakhound"]

[tool.pytest.ini_options]
testpaths = ["tests"]
